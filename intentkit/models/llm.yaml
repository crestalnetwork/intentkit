# IntentKit LLM model catalog -- the single source of truth for available models.
#
# Loaded at import time into AVAILABLE_MODELS, keyed by "{provider}:{id}".
# There is no database override: edit this file and restart to change the catalog.
#
# Field notes:
#   prices            USD per 1M tokens; quoted as strings to keep exact Decimal precision.
#   provider          which integration serves the model (see LLMProvider).
#   origin_provider   OpenRouter-only. Pins the upstream provider on OpenRouter via
#                     {"order": [origin_provider], "allow_fallbacks": false}.
#                     Omit to let OpenRouter pick the upstream provider.
#   legacy_ids        Retired ids this model supersedes. Agents still storing one
#                     of these are routed here at resolve time; never reuse a
#                     legacy id for a live model. When retiring a model, move its
#                     id (and its own legacy_ids) onto the successor entry.
#   reasoning_effort  Default reasoning/thinking effort when the agent doesn't
#                     set one. Uses OpenRouter's unified scale:
#                     "max"/"xhigh"/"high"/"medium"/"low"/"minimal"/"none" or null.
#   reasoning_levels  Efforts this model actually supports (same scale, per the
#                     provider's official docs). Agent requests are clamped to
#                     the nearest member: omit "none" for models whose reasoning
#                     cannot be disabled; single-member lists mean no control.
#   intelligence/speed/price_level  1-5 ratings.
#   compress_cold/compress_warm/compress_hot
#                     Optional per-model history-compression thresholds in tokens.
#                     Which one applies depends on how long ago the previous LLM
#                     request happened: hot within 1 hour, warm within 1 day,
#                     cold beyond that. Omit for the defaults: cold 20000,
#                     warm 50% of context_length, hot 80% of context_length.


